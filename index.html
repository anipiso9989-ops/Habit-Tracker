<!DOCTYPE html>
<html>
<head>
    <title>Habit Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #080808;
            color: #FAFAFA;
            font-family: monospace;

            background-image:
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);

            background-size: 24px 24px;
        }

        .container {
            width: min(900px, calc(100% - 48px));
            margin: 48px auto;
            border: 1px solid rgba(255,255,255,0.65);
            background: #0B0B0B;
        }

        header {
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.24);
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }

        .label {
            margin-bottom: 8px;
            color: #A3A3A3;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .add-panel {
            display: flex;
            padding: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.24);
        }

        input {
            flex: 1;
            height: 40px;
            padding: 0 12px;

            background: #080808;
            color: #FAFAFA;

            border: 1px solid rgba(255,255,255,0.65);
            border-right: none;

            font-family: monospace;
            outline: none;
        }

        input:focus {
            border-color: #FAFAFA;
        }

        button {
            height: 40px;
            padding: 0 16px;

            background: #080808;
            color: #FAFAFA;

            border: 1px solid #FAFAFA;

            font-family: monospace;
            cursor: pointer;
        }

        button:hover {
            background: #FAFAFA;
            color: #080808;
        }

        button:active {
            transform: translateY(1px);
        }

        #habit-list {
            padding: 24px;
        }

        .empty-state {
            padding: 32px 16px;
            border: 1px dashed rgba(255,255,255,0.24);

            color: #A3A3A3;

            font-size: 11px;
            letter-spacing: 0.12em;
            text-align: center;
        }

        .habit {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            padding: 16px;
            margin-bottom: 8px;

            border: 1px solid rgba(255,255,255,0.24);
            background: #0B0B0B;
        }

        .habit-info {
            min-width: 0;
        }

        .habit-info h2 {
            overflow-wrap: anywhere;
        }

        .habit-actions {
            display: flex;
            flex-wrap: wrap;
        }

        .habit-actions button + button {
            border-left: none;
        }

        .habit-actions .completed {
            background: #FAFAFA;
            color: #080808;
        }

        .habit h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 500;
        }

        .habit p {
            margin: 0;
            color: #A3A3A3;
            font-size: 13px;
        }

        @media (max-width: 640px) {
            .container {
                width: calc(100% - 24px);
                margin: 24px auto;
            }

            .habit {
                flex-direction: column;
                align-items: stretch;
            }

            .habit-actions {
                width: 100%;
            }

            .habit-actions button {
                flex: 1;
                padding: 0 8px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header>
            <div class="label">[01] SYSTEM / HABITS</div>
            <h1>Habit Tracker</h1>
        </header>

        <section class="add-panel">
            <input
                id="habit-name"
                type="text"
                placeholder="ENTER HABIT NAME"
            >

            <button id="add-button">
                [+] ADD
            </button>
        </section>

        <section id="habit-list"></section>

    </main>

    <script>
        async function loadHabits() {
            const response = await fetch("/habits");
            const habits = await response.json();

            const habitList = document.getElementById("habit-list");
            habitList.innerHTML = "";

            if (habits.length === 0) {
                habitList.innerHTML = `
                    <div class="empty-state">
                        [--] NO HABITS CONFIGURED
                    </div>
                `;
                return;
            }

            for (const habit of habits) {
                const habitElement = document.createElement("div");
                habitElement.className = "habit";

                habitElement.innerHTML = `
                    <div class="habit-info">
                        <h2></h2>
                        <p>${habit.streak} day streak</p>
                    </div>

                    <div class="habit-actions">
                        <button class="complete-button">
                            ${habit.completed_today ? "[-] UNDO" : "[+] COMPLETE"}
                        </button>

                        <button class="edit-button">
                            [~] EDIT
                        </button>

                        <button class="delete-button">
                            [X] DELETE
                        </button>
                    </div>
                `;

                habitElement.querySelector("h2").textContent = habit.name;

                const completeButton =
                    habitElement.querySelector(".complete-button");

                if (habit.completed_today) {
                    completeButton.classList.add("completed");
                    completeButton.addEventListener("click", () => {
                        undoHabit(habit.id);
                    });
                } else {
                    completeButton.addEventListener("click", () => {
                        completeHabit(habit.id);
                    });
                }

                habitElement
                    .querySelector(".edit-button")
                    .addEventListener("click", () => {
                        editHabit(habit.id, habit.name);
                    });

                habitElement
                    .querySelector(".delete-button")
                    .addEventListener("click", () => {
                        deleteHabit(habit.id);
                    });

                habitList.appendChild(habitElement);
            }
        }


        async function addHabit() {
            const input = document.getElementById("habit-name");
            const name = input.value.trim();

            if (name === "") {
                return;
            }

            const response = await fetch("/habits", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name
                })
            });

            if (response.ok) {
                input.value = "";
                await loadHabits();
            }
        }

        async function completeHabit(id) {
            const response = await fetch(`/habits/${id}/complete`, {
                method: "POST"
            });

            if (response.ok) {
                await loadHabits();
            }
        }


        async function undoHabit(id) {
            const response = await fetch(`/habits/${id}/complete`, {
                method: "DELETE"
            });

            if (response.ok) {
                await loadHabits();
            }
        }

        async function editHabit(id, currentName) {
            const newName = prompt("Rename habit:", currentName);

            if (newName === null || newName.trim() === "") {
                return;
            }

            const response = await fetch(`/habits/${id}`, {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: newName.trim()
                })
            });

            if (response.ok) {
                await loadHabits();
            }
        }

        async function deleteHabit(id) {
            const confirmed = confirm("Delete this habit?");

            if (!confirmed) {
                return;
            }

            const response = await fetch(`/habits/${id}`, {
                method: "DELETE"
            });

            if (response.ok) {
                await loadHabits();
            }
        }


        document
            .getElementById("add-button")
            .addEventListener("click", addHabit);

        document
            .getElementById("habit-name")
            .addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    addHabit();
                }
            });


        loadHabits();
    </script>

</body>
</html>
